# No build step, no dependencies, no package.json: BML is ES modules under
# plain node, so CI is `node --test` and nothing else.
#
# The conformance run is NOT here. It fetches Robert Harper's teaching corpus
# from cs.cmu.edu, which is his material and is not vendored in this
# repository; a job that hit a university web server on every push would be
# rude, and a red build caused by their downtime would say nothing about this
# code. Run it yourself: node tools/isml-conformance.mjs

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tests
        run: node --test test/*.test.js
      - name: every module parses
        run: |
          for f in $(find src bin tools -name '*.js' -o -name '*.mjs'); do
            node --check "$f" || exit 1
          done

      # The README tells you `npm install` puts `bml` on the path. It said so
      # once before it was true, so CI checks it now rather than trusting it.
      - name: the package installs and the bin runs
        run: |
          npm pack
          mkdir -p /tmp/installtest && cd /tmp/installtest
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/bml-lang-*.tgz
          printf '3 + 4\n:quit\n' | ./node_modules/.bin/bml | grep 'val it = 7 : int'
